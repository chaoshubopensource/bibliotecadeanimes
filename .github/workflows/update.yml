name: Atualizar Biblioteca

on:
  schedule:
    # Roda de 2 em 2 horas. O sync salva checkpoint — cada run continua de onde o anterior parou.
    # Um ciclo completo (1138 animes com delay humanizado ~8s/req) leva ~2–3 dias.
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # GitHub Actions mata jobs após 6h; saímos limpos aos 55min para o commit sempre acontecer.
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verificar dependências (já incluídas no ubuntu-latest)
        run: python -c "import requests, urllib3; print(f'requests {requests.__version__} / urllib3 {urllib3.__version__}')"

      - name: Sync (novos animes + episódios, humanizado com checkpoint)
        env:
          ANISTREAM_API_KEY: ${{ secrets.ANISTREAM_API_KEY }}
          ANISTREAM_USER_ID: ${{ secrets.ANISTREAM_USER_ID }}
        run: |
          # --max-runtime 50 → para limpo aos 50min, salva checkpoint, próximo run continua
          python anistream_scraper.py \
            --api-key "$ANISTREAM_API_KEY" \
            --user-id "$ANISTREAM_USER_ID" \
            --mode sync \
            --max-runtime 50

      - name: Commitar e enviar JSON atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biblioteca_completa.json
          git diff --cached --quiet && echo "nada novo, sem commit" || \
            git commit -m "auto: atualiza biblioteca $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
